name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
    
    # 设置 Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    # 设置 Flutter
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.2'
        channel: 'stable'
    
    # 创建密钥文件（从 GitHub Secrets 读取）
    - name: Setup QWeather Credentials
      run: |
        mkdir -p assets/keys
        
        # 配置私钥
        if [ -n "${{ secrets.QWEATHER_PRIVATE_KEY }}" ]; then
          echo "${{ secrets.QWEATHER_PRIVATE_KEY }}" > assets/keys/private_key.pem
          echo "✅ 和风天气私钥已配置"
        else
          echo "⚠️ 未配置和风天气私钥"
        fi
        
        # 配置凭据 ID
        if [ -n "${{ secrets.QWEATHER_CREDENTIAL_ID }}" ]; then
          echo "QWEATHER_CREDENTIAL_ID=${{ secrets.QWEATHER_CREDENTIAL_ID }}" >> $GITHUB_ENV
          echo "✅ 和风天气凭据 ID 已配置"
        else
          echo "⚠️ 未配置和风天气凭据 ID"
        fi
        
        # 配置项目 ID
        if [ -n "${{ secrets.QWEATHER_PROJECT_ID }}" ]; then
          echo "QWEATHER_PROJECT_ID=${{ secrets.QWEATHER_PROJECT_ID }}" >> $GITHUB_ENV
          echo "✅ 和风天气项目 ID 已配置"
        else
          echo "⚠️ 未配置和风天气项目 ID"
        fi
        
        # 配置 API Host
        if [ -n "${{ secrets.QWEATHER_API_HOST }}" ]; then
          echo "QWEATHER_API_HOST=${{ secrets.QWEATHER_API_HOST }}" >> $GITHUB_ENV
          echo "✅ 和风天气 API Host 已配置"
        else
          echo "⚠️ 未配置和风天气 API Host"
        fi
    
    # 配置固定 Android release 签名
    - name: Setup Android signing
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      run: |
        set -euo pipefail

        for name in \
          ANDROID_KEYSTORE_BASE64 \
          ANDROID_KEYSTORE_PASSWORD \
          ANDROID_KEY_ALIAS \
          ANDROID_KEY_PASSWORD; do
          if [ -z "${!name:-}" ]; then
            echo "::error::缺少 GitHub Secret: $name"
            exit 1
          fi
        done

        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/weather-release.p12
        chmod 600 android/app/weather-release.p12
        cat > android/key.properties <<EOF
        storePassword=$ANDROID_KEYSTORE_PASSWORD
        keyPassword=$ANDROID_KEY_PASSWORD
        keyAlias=$ANDROID_KEY_ALIAS
        storeFile=weather-release.p12
        storeType=PKCS12
        EOF
        chmod 600 android/key.properties

    # 获取依赖
    - name: Get dependencies
      run: flutter pub get

    # 接受 Android SDK 许可证并安装项目所需 NDK
    - name: Setup Android SDK licenses and NDK
      run: |
        export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
        export ANDROID_SDK_ROOT="$ANDROID_HOME"
        echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

        SDKMANAGER=""
        for candidate in \
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
          "$(command -v sdkmanager || true)"; do
          if [ -n "$candidate" ] && [ -x "$candidate" ]; then
            SDKMANAGER="$candidate"
            break
          fi
        done

        if [ -z "$SDKMANAGER" ]; then
          echo "未找到 sdkmanager，尝试通过 android-actions/setup-android 路径"
          ls -la "$ANDROID_HOME" || true
          ls -la "$ANDROID_HOME/cmdline-tools" || true
          exit 1
        fi

        echo "使用 sdkmanager: $SDKMANAGER"
        yes | "$SDKMANAGER" --licenses >/tmp/sdk-licenses.log 2>&1 || true
        "$SDKMANAGER" --install "ndk;30.0.14904198"
    
    # 运行测试（不阻塞 APK 构建；失败会在摘要中可见）
    - name: Run tests
      run: flutter test
      continue-on-error: true

    # 生成代码（slang / build_runner）
    - name: Generate code
      run: |
        dart run slang || true
        dart run build_runner build --delete-conflicting-outputs || true
    
    # 构建 GMS flavor release APK
    - name: Build APK
      run: flutter build apk --release --flavor gms --verbose
      timeout-minutes: 45
    
    # 上传 APK
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: |
          build/app/outputs/flutter-apk/app-gms-release.apk
          build/app/outputs/flutter-apk/app-*-gms-release.apk
    
    # 读取 pubspec.yaml 中的展示版本（忽略 Android build number）
    - name: Read app version
      id: app_version
      if: github.ref == 'refs/heads/main'
      shell: bash
      run: |
        set -euo pipefail

        raw_version="$(awk '$1 == "version:" { print $2; exit }' pubspec.yaml)"
        version_name="${raw_version%%+*}"
        if [[ ! "$version_name" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::pubspec.yaml 中的版本号无效: ${raw_version:-<empty>}"
          exit 1
        fi
        echo "name=$version_name" >> "$GITHUB_OUTPUT"

    # 创建 Release (仅在 push 到 main 时)
    - name: Create Release
      if: github.ref == 'refs/heads/main'
      uses: ncipollo/release-action@v1
      with:
        artifacts: "build/app/outputs/flutter-apk/app-gms-release.apk"
        token: ${{ secrets.GITHUB_TOKEN }}
        tag: "v${{ steps.app_version.outputs.name }}"
        name: "Release ${{ steps.app_version.outputs.name }}"
        body: |
          自动构建的 APK 文件
          
          ## 更新内容
          - 基于最新代码自动构建
          - 包含所有增强功能
        draft: false
        prerelease: false
        allowUpdates: true
